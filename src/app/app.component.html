<div *ngIf="actaulStateApplication == stateApplication.onStarting" class="splash">
  <div class="sk-cube-grid">
    <div class="sk-cube sk-cube1"></div>
    <div class="sk-cube sk-cube2"></div>
    <div class="sk-cube sk-cube3"></div>
    <div class="sk-cube sk-cube4"></div>
    <div class="sk-cube sk-cube5"></div>
    <div class="sk-cube sk-cube6"></div>
    <div class="sk-cube sk-cube7"></div>
    <div class="sk-cube sk-cube8"></div>
    <div class="sk-cube sk-cube9"></div>
  </div>
</div>

<!-- SONO IN ERRORE -->
<div *ngIf="actaulStateApplication == stateApplication.onError" class="error-container">
  <ion-grid>
    <ion-row>
      <ion-col 
          sizeXs="12" 
          sizeSm="12" 
          sizeMd="12"
          sizeLg="8" offsetLg="2"
          sizeXl="6" offsetXl="3"> 
        
        <!-- ERROR CARD MODERNA -->
        <div class="error-card">
          
          <!-- Header con Badge Versione -->
          <div 
              class="error-card__header"
              (click)="onClickSwitchCaptionError()">
            <div class="error-card__header-content">
              <div class="error-card__icon-wrapper">
                <ion-icon name="cloud-offline-outline"></ion-icon>
              </div>
              <div class="error-card__header-text">
                <h4>{{captionCardError}}</h4>
                <ion-badge class="version-badge">v{{versioneApp}}</ion-badge>
              </div>
            </div>
            <ion-icon 
                name="bug-outline" 
                class="debug-icon"
                [class.active]="switchErrorMessage">
            </ion-icon>
          </div>

          <!-- Immagine -->
          <div class="error-card__image">
            <img alt="Connection Error" src="assets/boysplaying_small.png">
          </div>

          <!-- Content -->
          <div class="error-card__content">
            <h1 class="error-card__title">Spiacenti</h1>
            <h2 class="error-card__subtitle">Qualcosa è andato storto</h2>
            
            <div class="error-card__message">
              <ion-icon name="wifi-outline"></ion-icon>
              <p>Non riesco a collegarmi per recuperare i dati. Verifica la rete e riprova.</p>
            </div>

            <!-- Pulsante Riprova -->
            <ion-button
                (click)="onStartApplication()" 
                expand="block"
                size="large"
                class="retry-button">
              <ion-icon slot="start" name="refresh-outline"></ion-icon>
              Riprova
            </ion-button>

            <!-- Messaggio Errore Tecnico (Espandibile) -->
            <div class="error-card__technical" *ngIf="switchErrorMessage">
              <div class="technical-message">
                <ion-icon name="information-circle-outline"></ion-icon>
                <div class="technical-message__content">
                  <h5>Dettagli Tecnici</h5>
                  <p *ngIf="errorMessage.length != 0">{{errorMessage}}</p>
                  <p *ngIf="errorMessage.length == 0" class="no-details">
                    Non sono presenti messaggi di errore aggiuntivi
                  </p>
                </div>
              </div>
            </div>
          </div>

        </div>

      </ion-col>
    </ion-row>
  </ion-grid>
</div>

<!-- PUO' PARTIRE L'APP -->
<ion-app *ngIf="actaulStateApplication == stateApplication.started"> 
    <ion-router-outlet></ion-router-outlet> 
</ion-app>
