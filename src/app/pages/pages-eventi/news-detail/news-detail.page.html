<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backButtonHref"></ion-back-button>
    </ion-buttons>
    <ion-title>News</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content>
  <ion-card>
    <ion-img [src]="newsDoc.LINKIMAGE" *ngIf="newsDoc.LINKIMAGE"></ion-img>
    <ion-card-header>
      <ion-card-title>
        {{ newsDoc.TITLE }}
      </ion-card-title>
      <ion-card-subtitle>
        {{ newsDoc.SUBTITLE }}
      </ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-text>
        {{ newsDoc.SHORTTEXT }}
      </ion-text>
    </ion-card-content>
  </ion-card> 
  
</ion-content>
<ion-footer *ngIf="existLinkNews()">
  <ion-button 
      color="primary" 
      expand="full"
      (click)="onClickReadNews(newsDoc.LINKNEWS)">
    Leggi articolo
  </ion-button>
</ion-footer>
