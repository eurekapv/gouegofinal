<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Materiale Allegato</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="onClose()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-refresher slot="fixed" (ionRefresh)="requestListAllegati($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- NESSUN DOCUMENTO PRESENTE -->
  <div *ngIf="listAllegati.length === 0" class="empty-state">
    <div class="empty-illustration">
      <div class="empty-icon-large">
        <ion-icon name="document-outline"></ion-icon>
      </div>
    </div>
    <h2 class="empty-title">Nessun allegato disponibile</h2>
    <p class="empty-description">Al momento non sono presenti materiali allegati per questo corso.</p>
  </div>

  <!-- DOCUMENTI PRESENTI -->
  <ion-grid *ngIf="listAllegati.length > 0" class="allegati-grid">
    <ion-row>
      <ion-col 
        sizeXs="12" 
        sizeSm="12" 
        sizeMd="6" 
        sizeLg="4" 
        sizeXl="4"
        *ngFor="let allegato of listAllegati">
        
        <div class="allegato-card" (click)="downloadAllegato(allegato)">
          <div class="allegato-icon-wrapper">
            <div class="allegato-icon-circle">
              <ion-icon [name]="allegato.fileTypeIconName"></ion-icon>
            </div>
          </div>
          
          <div class="allegato-content">
            <h3 class="allegato-title">{{allegato.DESCRIZIONE}}</h3>
            <div class="allegato-action">
              <ion-icon name="cloud-download-outline"></ion-icon>
              <span>Scarica</span>
            </div>
          </div>
        </div>

      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
