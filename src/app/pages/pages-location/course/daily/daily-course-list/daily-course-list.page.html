<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button  [defaultHref]="backButtonHref"></ion-back-button>
    </ion-buttons> 
    <ion-title>
      Lezioni
    </ion-title>
    <ion-buttons slot="end">
      <ion-button 
          (click)="onClickSwitchElencoMode()"
          fill="clear">
          {{elencoMode ? 'Giornate' : 'Elenco'}}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefreshData($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="booking-layout">
    <!-- ERRORE CARICAMENTO DATI -->
    <div class="ion-no-margin" *ngIf="loadedData && errorLoadingData">
      <app-empty-state
          icon="alert-circle-outline"
          type="error"
          title="Qualcosa non va"
          [message]="messageErrorPage">
      </app-empty-state>
    </div>

    <!-- CARICAMENTO CORRETTO -->
    <div class="ion-no-margin" *ngIf="loadedData && !errorLoadingData">

      <!-- MODALITA CARD SEZIONE -->
      <div class="ion-no-margin" *ngIf="!elencoMode">
        <!-- SEZIONE FISSA IN ALTO -->
        <div class="fixed-header ion-no-margin">
          <!-- SCROLLER SPORT -->
          <app-sport-scroll 
              [selectedSport]="selectedSport" 
              [sportList]="listLocationSport" 
              [direction]="directionSliderSportCampi"
              (sportChanged)="onChangeSport($event)" >
          </app-sport-scroll>
  
          <!-- CALENDARIO SCROLL -->
          <app-calendarscroll 
            [activeDay]="selectedDate"
            (onChangeActiveDay)="onChangeBookDay($event)">
          </app-calendarscroll> 
          
          <!-- RIGA CON ELENCO DEI LIVELLI -->
          <app-level-scroll
            [selectedLivello]="selectedLivello"
            (livelloChanged)="onChangeLivello($event)"
            *ngIf="selectedSport"
            [addAllLevelItem]="true"
            [livelliList]="livelliList">
          </app-level-scroll>          
        </div>

        <!-- SEZIONE SCROLLABILE-->
        <div class="scrollable-content">
          <!-- RIGA CON L'ELENCO DEI CORSI -->
          <ion-row *ngIf="listCorsi && listCorsi.length != 0">
            <ion-col>
              <ion-list>
                  <ion-list-header mode="ios" class="ion-padding-vertical">Corsi in programma</ion-list-header>

                  <app-daily-course-item-list
                    *ngFor="let itemCorso of listCorsi; index as i"
                    (OnClickItem)="onClickItem(itemCorso)"
                    [dailyCorsoDoc]="itemCorso"
                    [index]="i"
                    [alternateColor]="true"
                  >
                  </app-daily-course-item-list>
              </ion-list>

            </ion-col>
          </ion-row>

          <!-- NON CI SONO CORSI NELLA GIORNATA -->
          <div class="ion-no-margin" *ngIf="!existListCorsi">
            <app-empty-state
                icon="alert-circle-outline"
                type="info"
                title="Nessuna lezione disponibile"
                [message]="'modifica data, attivit&agrave; o livello per cercare altre lezioni'">
            </app-empty-state>
          </div>
         
        </div>



      </div>

      <!-- MODALITA ELENCO -->
      <div class="ion-no-margin" *ngIf="elencoMode">
        <!-- SEZIONE SCROLLABILE-->
        <div class="scrollable-content">

          <!-- NON CI SONO CORSI IN CALENDARIO -->
          <div class="ion-no-margin" *ngIf="!existListCorsiGrouped">
            <app-empty-state
                icon="alert-circle-outline"
                type="info"
                title="Nessuna lezione disponibile"
                [message]="'non sono previste prossime lezioni in calendario'">
            </app-empty-state>
          </div>

          <!-- SONO PRESENTI CORSI IN CALENDARIO -->
          <ion-list *ngIf="existListCorsiGrouped">
            <ion-list-header 
                mode="ios" 
                class="ion-padding-vertical">
                Prossime Lezioni
            </ion-list-header>

            <div *ngFor="let itemGrouped of listGroupedCorsi">
              <ion-item-divider class="ion-padding-vertical">
                <ion-label>{{itemGrouped.DATEFILTER | date: 'EEEE dd/MM/yyyy' | titlecase}}</ion-label>
                <ion-button 
                    (click)="onClickRequestAllGroupedCorsi(itemGrouped)"
                    slot="end" 
                    color="success" 
                    *ngIf="itemGrouped.ALLREQUESTED == false">tutti</ion-button>
              </ion-item-divider>

              <app-daily-course-item-list
                *ngFor="let itemCorso of itemGrouped.LISTCORSI; index as i"
                (OnClickItem)="onClickItem(itemCorso)"
                [dailyCorsoDoc]="itemCorso"
                [index]="i"
                [alternateColor]="true"
                [extendedInfo]="true"
              >
            </app-daily-course-item-list>                

            </div>
          </ion-list>

          <!-- INFINITE SCROLL -->
          <ion-infinite-scroll
              threshold="100px"
              (ionInfinite)="requestListGroupedCorsi($event)"
              >
              <ion-infinite-scroll-content 
                  loading-spinner="bubbles" 
                  loadingText="Attendere...">
              </ion-infinite-scroll-content>
          </ion-infinite-scroll>           
        </div>
      </div>

    </div>

  </div>




</ion-content>
