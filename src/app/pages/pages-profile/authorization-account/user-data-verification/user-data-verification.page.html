<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button 
            (click)="closeModal()"
            fill="clear">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Verifica Dati</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  
  <div class="page-container">

    <form [formGroup]="formPagePrimary">

      <!-- Immagine Header -->
      <!-- <div class="header-image">
        <img [src]="srcImage" alt="Verifica Dati" />
      </div> -->

      <!-- Info Box -->
      <div class="info-box">
        <ion-icon name="information-circle" class="info-icon"></ion-icon>
        <p [innerHTML]="informationText | safeHtml"></p>
      </div>

      <!-- ========== SEZIONE 1: DATI PERSONALI ========== -->
      <div class="section-card">
        <div class="section-header">
          <div class="header-icon">
            <ion-icon name="person"></ion-icon>
          </div>
          <h3>Dati Personali</h3>
        </div>

        <div class="section-body">
          
          <!-- Nome -->
          <div class="input-group">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <ion-input
                  label="Nome"
                  labelPlacement="floating"
                  type="text"
                  placeholder="Inserisci il tuo nome"
                  [clearInput]="true"
                  formControlName="profileName">
            </ion-input>
          </div>

          <!-- Cognome -->
          <div class="input-group">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <ion-input
                  label="Cognome"
                  labelPlacement="floating"
                  type="text"
                  placeholder="Inserisci il tuo cognome"
                  [clearInput]="true"
                  formControlName="profileSurname">
            </ion-input>
          </div>

          <!-- Email -->
          <div class="input-group">
            <ion-icon name="mail" class="input-icon"></ion-icon>
            <ion-input
                  label="E-mail"
                  labelPlacement="floating"
                  type="email"
                  placeholder="tuaemail@esempio.com"
                  [clearInput]="true"
                  formControlName="profileEmail">
            </ion-input>
          </div>

          <!-- Alert Email non verificata -->
          <div class="verification-alert" *ngIf="flagShowMailCode">
            <ion-icon name="warning" class="alert-icon"></ion-icon>
            <div class="alert-content">
              <p>Mail non verificata, è necessario ricevere un codice di verifica</p>
              <ion-button
                    (click)="onRequestReinvioCode('mail')"
                    fill="solid"
                    color="success"
                    size="small">
                <ion-icon name="mail-outline" slot="start"></ion-icon>
                Invia Codice
              </ion-button>
            </div>
          </div>

          <!-- Codice Verifica Email -->
          <div class="input-group code-verify" *ngIf="flagShowMailCode">
            <ion-icon name="key" class="input-icon"></ion-icon>
            <ion-input
                  label="Codice E-mail"
                  labelPlacement="floating"
                  placeholder="12345"
                  [clearInput]="false"
                  formControlName="verificationMailCode"
                  type="tel"
                  inputmode="numeric"
                  [maxlength]="verificationCodeLength">
            </ion-input>
          </div>

          <!-- Mobile -->
          <div class="input-group">
            <ion-icon name="call" class="input-icon"></ion-icon>
            <ion-input
                  label="Numero Mobile"
                  labelPlacement="floating"
                  type="tel"
                  placeholder="+39 123 456 7890"
                  [clearInput]="true"
                  formControlName="profileMobile">
            </ion-input>
          </div>

          <!-- Alert Mobile non verificato -->
          <div class="verification-alert" *ngIf="flagShowSmsCode">
            <ion-icon name="warning" class="alert-icon"></ion-icon>
            <div class="alert-content">
              <p>Numero mobile non verificato, è necessario ricevere un codice di verifica</p>
              <ion-button
                    (click)="onRequestReinvioCode('mobile')"
                    fill="solid"
                    color="success"
                    size="small">
                <ion-icon name="chatbox-outline" slot="start"></ion-icon>
                Invia Codice
              </ion-button>
            </div>
          </div>

          <!-- Codice Verifica SMS -->
          <div class="input-group code-verify" *ngIf="flagShowSmsCode">
            <ion-icon name="key" class="input-icon"></ion-icon>
            <ion-input
                  label="Codice SMS"
                  labelPlacement="floating"
                  placeholder="12345"
                  [clearInput]="false"
                  formControlName="verificationSmsCode"
                  type="tel"
                  inputmode="numeric"
                  [maxlength]="verificationCodeLength">
            </ion-input>
          </div>

        </div>
      </div>

      <!-- ========== SEZIONE 2: DATI ANAGRAFICI ========== -->
      <div class="section-card">
        <div class="section-header">
          <div class="header-icon">
            <ion-icon name="id-card"></ion-icon>
          </div>
          <h3>Dati Anagrafici</h3>
        </div>

        <div class="section-body">
          
          <!-- Codice Fiscale -->
          <div class="input-group">
            <ion-icon name="card-outline" class="input-icon"></ion-icon>
            <ion-input
                  label="Codice Fiscale"
                  labelPlacement="floating"
                  type="text"
                  placeholder="RSSMRA80A01H501Z"
                  [clearInput]="true"
                  (ionBlur)="onCfChange()"
                  formControlName="codiceFiscale">
            </ion-input>
          </div>

          <!-- Sesso -->
          <div class="input-group">
            <ion-icon name="male-female-outline" class="input-icon"></ion-icon>
            <ion-select
                  label="Sesso"
                  labelPlacement="floating"
                  interface="popover"
                  formControlName="sesso">
              <ion-select-option 
                *ngFor="let sesso of listSesso"
                [value]="sesso.value">
                {{ sesso.description }}
              </ion-select-option>
            </ion-select>
          </div>

          <!-- Data di nascita -->
          <div class="date-input-wrapper">
            <app-dtinput
                  title="Data di nascita"
                  label="Nato il"
                  labelPlacement="stacked"
                  [(actualDate)]="this.utenteVerification.NATOIL">
            </app-dtinput>
          </div>

        </div>
      </div>

      <!-- ========== SEZIONE 3: INDIRIZZO ========== -->
      <div class="section-card">
        <div class="section-header">
          <div class="header-icon">
            <ion-icon name="home"></ion-icon>
          </div>
          <h3>Indirizzo di Residenza</h3>
        </div>

        <div class="section-body">
          
          <!-- Indirizzo -->
          <div class="input-group">
            <ion-icon name="location-outline" class="input-icon"></ion-icon>
            <ion-input
                  label="Indirizzo"
                  labelPlacement="floating"
                  type="text"
                  placeholder="Via/Piazza"
                  [clearInput]="true"
                  formControlName="indResidenza">
            </ion-input>
          </div>

          <!-- Comune -->
          <div class="input-group">
            <ion-icon name="business-outline" class="input-icon"></ion-icon>
            <ion-input
                  label="Comune"
                  labelPlacement="floating"
                  type="text"
                  placeholder="Città"
                  [clearInput]="true"
                  formControlName="comResidenza">
            </ion-input>
          </div>

          <!-- CAP e Provincia -->
          <div class="input-row">
            <div class="input-group half">
              <ion-icon name="mail-outline" class="input-icon"></ion-icon>
              <ion-input
                    label="CAP"
                    labelPlacement="floating"
                    placeholder="00000"
                    [clearInput]="true"
                    type="tel"
                    inputmode="tel"
                    maxlength="5"
                    formControlName="capResidenza">
              </ion-input>
            </div>

            <div class="input-group half">
              <ion-icon name="map-outline" class="input-icon"></ion-icon>
              <ion-input
                    label="Provincia"
                    labelPlacement="floating"
                    placeholder="Sigla"
                    [clearInput]="true"
                    formControlName="provResidenza">
              </ion-input>
            </div>
          </div>

          <!-- Stato -->
          <div class="input-group">
            <ion-icon name="flag-outline" class="input-icon"></ion-icon>
            <ion-input
                  label="Stato"
                  labelPlacement="floating"
                  type="text"
                  placeholder="Italia"
                  [clearInput]="true"
                  formControlName="statoResidenza">
            </ion-input>
          </div>

        </div>
      </div>

      <!-- BOTTONE CONFERMA -->
      <ion-button
            class="confirm-button"
            expand="block"
            size="large"
            (click)="onSubmitData()">
        <ion-icon name="checkmark-circle" slot="start"></ion-icon>
        Conferma Dati
      </ion-button>

    </form>

  </div>

</ion-content>
