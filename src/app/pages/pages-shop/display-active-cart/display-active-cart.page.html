<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backButtonHref"></ion-back-button>
    </ion-buttons>
    <ion-title>Carrello</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  
  <div class="cart-container">

    <!-- ========================================== -->
    <!-- EMPTY STATE -->
    <!-- ========================================== -->
    <div class="empty-cart" *ngIf="numProdotti === 0">
      
      <!-- Icon -->
      <div class="empty-icon">
        <ion-icon name="cart-outline"></ion-icon>
      </div>

      <!-- Title -->
      <h2>Il tuo carrello è vuoto</h2>
      <p>Non hai ancora scelto nessun prodotto</p>

      <!-- Images Grid -->
      <div class="empty-images">
        <img *ngFor="let image of specialPicture" 
             [src]="image" 
             alt="Shop">
      </div>

      <!-- CTA -->
      <ion-button 
          (click)="onGoToBack()"
          expand="block"
          color="success"
          size="large"
          class="empty-cta">
        <ion-icon name="storefront" slot="start"></ion-icon>
        Scopri i nostri prodotti
      </ion-button>

    </div>

    <!-- ========================================== -->
    <!-- CART WITH ITEMS -->
    <!-- ========================================== -->
    <div class="cart-content" *ngIf="numProdotti !== 0">

      <!-- Summary Card (Sticky Top) -->
      <div class="summary-card">
        <div class="summary-header">
          <div class="summary-info">
            <span class="summary-label">
              {{numProdotti === 1 ? '1 articolo' : numProdotti + ' articoli'}}
            </span>
            <h2 class="summary-total">{{carrelloDoc.TOTDOCUMENTO | currency: 'EUR'}}</h2>
          </div>
          <ion-icon name="cart" class="summary-icon"></ion-icon>
        </div>
      </div>

      <!-- Products List -->
      <div class="products-list">
        <div class="product-card" 
             *ngFor="let item of carrelloDoc.DETAILCARRELLO; let i = index"
             [style.animation-delay]="(i * 0.05) + 's'">
          
          <app-cart-item-row 
              (onChangeQuantity)="onChangeQuantity($event)"
              (onDeleteRequest)="onDeleteRequest($event)"
              [rowDetail]="item">
          </app-cart-item-row>

        </div>
      </div>

      <!-- Bottom Spacer -->
      <div class="bottom-spacer"></div>

    </div>

  </div>

  <!-- ========================================== -->
  <!-- FIXED CHECKOUT BUTTON -->
  <!-- ========================================== -->
  <div class="fixed-checkout" *ngIf="numProdotti !== 0">
    <div class="checkout-info">
      <span class="checkout-label">Totale</span>
      <span class="checkout-total">{{carrelloDoc.TOTDOCUMENTO | currency: 'EUR'}}</span>
    </div>
    <ion-button 
        (click)="onClickOrdina()"
        expand="block"
        color="success"
        size="large"
        class="checkout-button">
      <ion-icon name="checkmark-circle" slot="start"></ion-icon>
      Procedi all'ordine
    </ion-button>
  </div>

</ion-content>
