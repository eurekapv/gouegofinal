<ion-grid class="modern-calendar ion-no-margin ion-no-padding">
  
  <!-- HEADER MESE/ANNO -->
  <ion-row class="calendar-header">
    <ion-col size="12">
      <div class="header-content">
        
        <!-- Bottone mese precedente -->
        <button class="nav-button" (click)="goToPreviousMonth()">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </button>

        <!-- Data corrente -->
        <div class="current-date">
          <h2 class="date-day">{{ _activeDay | date: 'dd MMMM yyyy' | uppercase }}</h2>
          <p class="date-weekday">{{ _activeDay | date: 'EEEE' | uppercase }}</p>
        </div>

        <!-- Bottone mese successivo -->
        <button class="nav-button" (click)="goToNextMonth()">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </button>
      </div>
    </ion-col>
  </ion-row>

  <!-- GIORNI SCROLLABILI -->
  <ion-row class="calendar-days">
    <ion-col size="12">
      <!-- Aggiungi #daysScrollContainer qui -->
      <div class="days-scroll" #daysScrollContainer>
        
        <ng-container *ngFor="let day of listDay; let i = index">
          
          <!-- SEPARATORE MESE (quando cambia il mese) -->
          <div *ngIf="shouldShowMonthDivider(i)" class="month-divider">
            <div class="month-divider-line"></div>
            <span class="month-divider-label">
              {{ day.dateValue | date: 'MMM yyyy' | uppercase }}
            </span>
            <div class="month-divider-line"></div>
          </div>

          <!-- BOTTONE GIORNO -->
          <button
            class="day-button"
            [class.day-button--active]="isActiveDay(day)"
            [class.day-button--today]="isToday(day)"
            (click)="onClickDay(day)">
            
            <span class="day-number">{{ day.dateValue | date: 'd' }}</span>
            <span class="day-letter">{{ day.dateValue | date: 'EEE' | uppercase | slice:0:1 }}</span>
          </button>

        </ng-container>

      </div>
    </ion-col>
  </ion-row>

</ion-grid>
