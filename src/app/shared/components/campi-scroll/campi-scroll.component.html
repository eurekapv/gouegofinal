<ion-grid class="campi-inline-container ion-no-margin ion-no-padding">
  <!-- Messaggio se non ci sono campi -->
  <ion-row 
    class="ion-text-center ion-align-items-center"
    *ngIf="!_flagAvailableCampi">
    <ion-col>
      <div class="empty-state">
        <ion-icon name="location-outline"></ion-icon>
        <p>
          Il centro <strong>{{ selectedLocation?.DENOMINAZIONE }}</strong> 
          non dispone di campi prenotabili
        </p>
      </div>
    </ion-col>
  </ion-row>

  <!-- Header con icona + nome campo selezionato -->

        </div>
        <div class="header-info">

          <p class="campo-subtitle" *ngIf="selectedLocation">
            {{ selectedLocation.DENOMINAZIONE }}
          </p>
        </div>
      </div>
    </ion-col>
  </ion-row> -->

  <!-- Lista campi scrollabile -->
  <ion-row *ngIf="_flagAvailableCampi" class="campi-list-row">
    <ion-col size="12">
      <div class="campi-scroll">
        <div 
            class="campo-selected-header" 
            *ngFor="let campo of _listAvailableCampi">

          <div class="header-icon-circle">
            <ion-icon name="location"></ion-icon>
          </div>
          <div class="header-info">
            <h3 class="campo-title">{{ campo?.DENOMINAZIONE || 'Seleziona un campo' }}</h3>
            <p class="campo-subtitle" *ngIf="selectedLocation">
              {{ selectedLocation.DENOMINAZIONE }}
            </p>
          </div>
          
        </div>

        <!-- <button
          *ngFor="let campo of _listAvailableCampi"
          class="campo-chip"
          [class.campo-chip--active]="isSelected(campo)"

          [disabled]="!canChoose"
          (click)="onChangeCampo(campo)">
          
          <ion-icon name="location-outline" class="chip-icon"></ion-icon>
          <span class="chip-label">{{ campo.DENOMINAZIONE }}</span>
        </button> -->
      </div>
    </ion-col>
  </ion-row>

</ion-grid>
