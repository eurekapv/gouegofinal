<div 
  class="news-card"
  [class.clickable]="!myNews.do_inserted"
  (click)="onClickNews()">
  
  <!-- Image / Icon Section -->
  <div class="news-image-wrapper">
    <!-- Con immagine -->
    <div class="news-image" *ngIf="myNews.LINKIMAGE">
      <img [src]="myNews.LINKIMAGE" [alt]="myNews.TITLE" />
      <div class="image-overlay"></div>
    </div>

    <!-- Senza immagine - Icona grande -->
    <div class="news-icon-fallback" *ngIf="!myNews.LINKIMAGE">
      <ion-icon [name]="myNews._NAMEICON || 'newspaper'" [color]="myNews._COLOR || 'primary'"></ion-icon>
    </div>

    <!-- Badge tipo (opzionale) -->
    <div class="news-badge" *ngIf="!myNews.do_inserted">
      <ion-icon name="newspaper-outline"></ion-icon>
      <span>News</span>
    </div>
  </div>

  <!-- Content Section -->
  <div class="news-content">
    <h3 class="news-title">{{ myNews.TITLE }}</h3>
    
    <p class="news-subtitle" *ngIf="myNews.SUBTITLE">
      {{ myNews.SUBTITLE }}
    </p>

    <!-- Footer con data -->
    <div class="news-footer" *ngIf="myNews.PUBBLICATADAL">
      <div class="news-date">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>{{ myNews.PUBBLICATADAL | date: 'dd/MM/yyyy' }}</span>
      </div>
      <ion-icon name="chevron-forward" class="arrow-icon"></ion-icon>
    </div>
  </div>

</div>
