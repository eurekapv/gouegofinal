<div class="sport-compact-container">
  <!-- Messaggio vuoto -->
  <div class="empty-message" *ngIf="!_flagAvailableSports">
    <ion-icon name="ban-outline"></ion-icon>
    <span>Nessuna attività disponibile</span>
  </div>

  <!-- Sport scrollabili -->
  <div class="sport-scroll" *ngIf="_flagAvailableSports">
    <button
      *ngFor="let sport of _listAvailableSports"
      class="sport-btn"
      [class.sport-btn--active]="isSelected(sport)"
      (click)="onChangeSport(sport)">
      
      <i class="sport-icon" [innerHTML]="sport.htmlIconHex"></i>
      <span class="sport-label">{{ sport.DENOMINAZIONE }}</span>
    </button>
  </div>
</div>
